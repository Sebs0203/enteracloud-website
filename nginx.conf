server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # App de una sola página: redirige rutas inexistentes al index.html para evitar 404 de nginx
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html sin caché para que cada deploy se vea al recargar.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Archivos con hash: caché larga.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
